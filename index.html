<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriel ❤️ Maria</title>

<style>

body{
margin:0;
padding:20px;
background:linear-gradient(135deg,#ff8fb1,#ffd8e6);
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
}

.card{
background:white;
width:100%;
max-width:430px;
padding:20px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#ff2d75;
}

.pessoa{
background:#fff0f6;
padding:15px;
border-radius:15px;
margin-bottom:15px;
text-align:center;
}

.pontos{
font-size:35px;
font-weight:bold;
color:#ff2d75;
margin:10px;
}

button{
background:#ff2d75;
color:white;
border:none;
padding:12px 18px;
border-radius:12px;
font-size:18px;
margin:5px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

textarea{
width:100%;
height:90px;
padding:10px;
font-size:16px;
border-radius:12px;
box-sizing:border-box;
}

#historico{
margin-top:20px;
}

.item{
background:#ffe4ef;
padding:10px;
border-radius:10px;
margin-bottom:8px;
}

</style>

</head>

<body>

<div class="card">

<h1>❤️ Gabriel & Maria ❤️</h1>

<div class="pessoa">
<h2>Gabriel</h2>

<div class="pontos" id="gabriel">0</div>

<button onclick="maisGabriel()">➕</button>

<button onclick="menosGabriel()">➖</button>

</div>

<div class="pessoa">

<h2>Maria</h2>

<div class="pontos" id="maria">0</div>

<button onclick="maisMaria()">➕</button>

<button onclick="menosMaria()">➖</button>

</div>

<h2>💖 Demonstração de carinho</h2>

<textarea id="texto" placeholder="Ex: Gabriel levou chocolate para Maria ❤️"></textarea>

<button onclick="salvar()">💾 Salvar</button>

<h2>📜 Histórico</h2>

<div id="historico"></div>

</div>

<script>

let pontosGabriel=Number(localStorage.getItem("gabriel"))||0;

let pontosMaria=Number(localStorage.getItem("maria"))||0;

let historico=JSON.parse(localStorage.getItem("historico"))||[];

function atualizar(){

document.getElementById("gabriel").innerHTML=pontosGabriel;

document.getElementById("maria").innerHTML=pontosMaria;

localStorage.setItem("gabriel",pontosGabriel);

localStorage.setItem("maria",pontosMaria);

localStorage.setItem("historico",JSON.stringify(historico));

let lista="";

for(let i=historico.length-1;i>=0;i--){

lista+="<div class='item'>❤️ "+historico[i]+"</div>";

}

document.getElementById("historico").innerHTML=lista;

}

function maisGabriel(){

pontosGabriel++;

atualizar();

}

function menosGabriel(){

if(pontosGabriel>0){

pontosGabriel--;

atualizar();

}

}

function maisMaria(){

pontosMaria++;

atualizar();

}

function menosMaria(){

if(pontosMaria>0){

pontosMaria--;

atualizar();

}

}

function salvar(){

let texto=document.getElementById("texto").value.trim();

if(texto!=""){

historico.push(texto);

document.getElementById("texto").value="";

atualizar();

}

}function salvar(){

let texto=document.getElementById("texto").value.trim();

if(texto!=""){

historico.push(texto);

document.getElementById("texto").value="";

atualizar();

}

}

atualizar();

</script>

</body>

</html>
