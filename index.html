<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriel ❤️ Maria</title>

<style>

body{
margin:0;
padding:20px;
background:linear-gradient(135deg,#ff8fb1,#ffd8e6);
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
}

.card{
background:white;
width:100%;
max-width:430px;
padding:20px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#ff2d75;
}

.pessoa{
background:#fff0f6;
padding:15px;
border-radius:15px;
margin-bottom:15px;
text-align:center;
}

.pontos{
font-size:35px;
font-weight:bold;
color:#ff2d75;
margin:10px;
}

button{
background:#ff2d75;
color:white;
border:none;
padding:12px 18px;
border-radius:12px;
font-size:18px;
margin:5px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

textarea{
width:100%;
height:90px;
padding:10px;
font-size:16px;
border-radius:12px;
box-sizing:border-box;
}

#historico{
margin-top:20px;
}

.item{
background:#ffe4ef;
padding:10px;
border-radius:10px;
margin-bottom:8px;
}

</style>

</head>

<body>

<div class="card">

<h1>❤️ Gabriel & Maria ❤️</h1>

<div class="pessoa">
<h2>Gabriel</h2>

<div class="pontos" id="gabriel">0</div>

<button onclick="maisGabriel()">➕</button>

<button onclick="menosGabriel()">➖</button>

</div>

<div class="pessoa">

<h2>Maria</h2>

<div class="pontos" id="maria">0</div>

<button onclick="maisMaria()">➕</button>

<button onclick="menosMaria()">➖</button>

</div>

<h2>💖 Demonstração de carinho</h2>

<textarea id="texto" placeholder="Ex: Gabriel levou chocolate para Maria ❤️"></textarea>

<button onclick="salvar()">💾 Salvar</button>

<h2>📜 Histórico</h2>

<div id="historico"></div>

</div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDONRxj4nIuf74zORpizm_iX_u1mGvE-lI",
  authDomain: "gabriel-e-maria-ee731.firebaseapp.com",
  databaseURL: "https://gabriel-e-maria-ee731-default-rtdb.firebaseio.com",
  projectId: "gabriel-e-maria-ee731",
  storageBucket: "gabriel-e-maria-ee731.firebasestorage.app",
  messagingSenderId: "132757616911",
  appId: "1:132757616911:web:5916747ba5824a09b4e67a"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const dados = db.ref("contador");
  
let pontosGabriel=0;
let pontosMaria=0;
let historico=[];

function atualizar(){

document.getElementById("gabriel").innerHTML=pontosGabriel;

document.getElementById("maria").innerHTML=pontosMaria;

dados.set({
  gabriel: pontosGabriel,
  maria: pontosMaria,
  historico: historico
});

let lista="";

for(let i=historico.length-1;i>=0;i--){

lista+="<div class='item'>❤️ "+historico[i]+"</div>";

}

document.getElementById("historico").innerHTML=lista;

}

function maisGabriel(){

pontosGabriel++;

  dados.on("value", (snapshot) => {

  const valor = snapshot.val();

  if(valor){

    pontosGabriel = valor.gabriel || 0;
    pontosMaria = valor.maria || 0;
    historico = valor.historico || [];

  }

  atualizar();

});

}

function maisGabriel(){

  pontosGabriel++;

  atualizar();

}


  
function menosGabriel(){

if(pontosGabriel>0){

pontosGabriel--;

atualizar();

}

}

function maisMaria(){

pontosMaria++;

atualizar();

}

function menosMaria(){

if(pontosMaria>0){

pontosMaria--;

atualizar();

}

}

function salvar(){

let texto=document.getElementById("texto").value.trim();

if(texto!=""){

historico.push(texto);

document.getElementById("texto").value="";

atualizar();

}

dados.on("value", function(snapshot){

  }

  document.getElementById("gabriel").innerHTML = pontosGabriel;
  document.getElementById("maria").innerHTML = pontosMaria;

  let lista="";

    lista+="<div class='item'>❤️ "+historico[i]+"</div>";

  }

  document.getElementById("historico").innerHTML=lista;

});

</script>

</body>

</html>
